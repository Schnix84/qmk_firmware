name: Build Q3 HE (my_led_fn)

on:
  workflow_dispatch:
  push:
    branches:
      - hall_effect_playground
      - master
      - main
    paths:
      - 'keyboards/keychron/q3_he/**'
      - '.github/workflows/build_q3he.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full, with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install ARM toolchain and DFU utils
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            dfu-util dfu-programmer

      - name: Build firmware (GNU make with explicit vars)
        env:
          KEYBOARD: keychron/q3_he/iso_encoder
          KEYMAP:   my_led_fn
        run: |
          make -j1 KEYBOARD=$KEYBOARD KEYMAP=$KEYMAP
          ls -la ./.build || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: q3_he_my_led_fn
          path: |
            ./.build/**/*.bin
            ./.build/**/*.hex
            ./.build/**/*.dfu
            ./.build/**/*.uf2