name: Build Q3 HE (my_led_fn)

on:
  workflow_dispatch:
  push:
    branches:
      - hall_effect_playground
      - master
      - main
    paths:
      - 'keyboards/keychron/q3_he/**'
      - '.github/workflows/build_q3he.yml'

permissions:
  contents: read

concurrency:
  group: q3he-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'

      - name: Checkout (full, with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: pip3 install -r requirements.txt
        
      - name: Build firmware (GNU make, only Q3 HE my_led_fn)
        run: |
          make -j1 keychron/q3_he/iso_encoder:my_led_fn
          ls -la ./.build || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: q3_he_my_led_fn
          path: |
            .build/keychron_q3_he_iso_encoder_my_led_fn.bin
            .build/keychron_q3_he_iso_encoder_my_led_fn.hex
